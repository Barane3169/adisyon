name: Adisyon EXE Derle

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        run: pip install pyinstaller

      - name: EXE derle
        run: pyinstaller --onefile --noconsole --name Adisyon main.py

      - name: EXE'yi yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Adisyon-exe
          path: dist/Adisyon.exe
